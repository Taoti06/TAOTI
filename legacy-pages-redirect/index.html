<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TAOTI has moved</title>
  <meta http-equiv="refresh" content="0; url=https://taoti06.github.io/TAOTI/">
  <script>
    (function () {
      var oldBase = "/intent-and-practice";
      var path = location.pathname;
      var suffix = path === oldBase ? "/" : path.startsWith(oldBase + "/") ? path.slice(oldBase.length) : "/";
      location.replace("https://taoti06.github.io/TAOTI" + suffix + location.search + location.hash);
    }());
  </script>
</head>
<body>
  <p>TAOTI has moved to <a href="https://taoti06.github.io/TAOTI/">https://taoti06.github.io/TAOTI/</a>.</p>
</body>
</html>
